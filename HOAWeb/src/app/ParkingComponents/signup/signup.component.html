<div class="container">
    <div class="form-container">
      <h2>New Registration</h2>
      <form #userForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" class="form-control" id="username" name="username" [(ngModel)]="userData.UserName" required>
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" class="form-control" id="password" name="password" [(ngModel)]="userData.Password" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password:</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" [(ngModel)]="userData.ConfirmPassword" required>
          <!-- <div *ngIf="userForm.controls['confirmPassword'].invalid && (userForm.controls['confirmPassword'].dirty || userForm.controls['confirmPassword'].touched)"
            class="text-danger">
            <div *ngIf="userData.password !== userData.confirmPassword">Passwords do not match.</div>
          </div> -->
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" class="form-control" id="email" name="email" [(ngModel)]="userData.EmailId" required>
           
        </div>
        <div class="form-group"  >
          <label for="mobile">Mobile Number:</label>
          <input type="tel" class="form-control" id="mobile" name="mobile" [(ngModel)]="userData.MobileNumber" required>
        </div>
        <div class="form-group">
          <label>Prefered OTP to : &nbsp; </label>
          <div class="form-check"  style='display: inline-block !important;'>
            &nbsp;<input class="form-check-input" type="radio" id="otpEmail" name="preferedOTP" value="Email" [(ngModel)]="userData.PreferedOTP">
            <label class="form-check-label" for="otpEmail">
              Email
            </label>
            &nbsp;

          </div>
          <div class="form-check"  style='display: inline-block !important;'>
            <input class="form-check-input" type="radio" id="otpMobile" name="preferedOTP" value="Mobile" [(ngModel)]="userData.PreferedOTP">
            <label class="form-check-label" for="otpMobile">
              Mobile Number
            </label>
          </div>
        </div>

        
      <div class="form-group">
          <label>I Want to Register as : </label>
          <div class="form-check">
            <input class="form-check-input" type="radio" id="cutomer" name="Iam" value="Customer" [(ngModel)]="userData.Iam">
            <label class="form-check-label" for="customer">
              Customer (Car Owner)
            </label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" id="otpMobile" name="Iam" value="HOA" [(ngModel)]="userData.Iam">
            <label class="form-check-label" for="HOA">
             House Owner Association
            </label>
          </div>
       
        <div class="form-check">
          <input class="form-check-input" type="radio" id="towingcompany" name="Iam" value="TowingCompany" [(ngModel)]="userData.Iam">
          <label class="form-check-label" for="towingcompany">
            Towing Company
          </label>
        </div>
      </div>
    
      <div *ngIf="HOAoptions.length > 0" class="form-group">
        <select name="selectedQuantity" id="aantal" class="form-control" [(ngModel)]="userData.HOAId">
          <option *ngFor="let option of HOAoptions" [value]="option.id">{{option.value}}</option>
       </select>
  
      </div>
      

    


        <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">Submit</button>
        <button type="reset" class="btn btn-secondary" (click)="Reset()">Reset</button>
        <button type="reset" class="btn btn-secondary" (click)="BacktoLogin()">Back To Login</button>
      </form>
    </div>
  </div>
